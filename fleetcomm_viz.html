<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>FleetComm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; background: #f2f1ed; color: #1c1c1e; font-family: 'Inter', sans-serif; }
  .msym { font-family: 'Material Symbols Outlined'; font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; font-size: 18px; vertical-align: middle; line-height: 1; }
  .msym-fill { font-variation-settings: 'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
  #map, .leaflet-container { background: #e8e6e0 !important; }
  .leaflet-control-zoom { display: none !important; }
  .leaflet-control-attribution { font-size: 9px !important; color: #8e8e93 !important; background: rgba(255,255,255,0.7) !important; }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d4cfc8; border-radius: 2px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 2px; background: #e8e5e0; outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #FF6B35; cursor: pointer; box-shadow: 0 0 6px rgba(255,107,53,0.5); }
  .glass { background: rgba(255,255,255,0.92); backdrop-filter: blur(20px); border: 1px solid rgba(0,0,0,0.08); }
  .sidebar { display: flex; flex-direction: column; flex-shrink: 0; background: rgba(255,255,255,0.88); backdrop-filter: blur(24px); z-index: 40; }
  .slabel { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; color: #6e6e73; }
  @keyframes blink { 0%,100% { opacity:1; } 50% { opacity:0.25; } }
  .blink { animation: blink 2s infinite; }
  button { cursor: pointer; }
  button:focus { outline: none; }
</style>
</head>
<body>

<!-- NAV -->
<nav style="position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,0.94);backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,0.09);z-index:100;box-shadow:0 1px 8px rgba(0,0,0,0.06)">
  <div style="display:flex;align-items:center;gap:14px">
    <span style="font-family:'Space Grotesk',sans-serif;font-size:19px;font-weight:700;color:#FF6B35;letter-spacing:-0.3px">FleetComm</span>
    <div style="display:flex;align-items:center;gap:7px">
      <div class="blink" style="width:5px;height:5px;border-radius:50%;background:#2DB84B;box-shadow:0 0 6px rgba(45,184,75,0.5)"></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#6e6e73;text-transform:uppercase;letter-spacing:0.12em">Sim Engine Active</span>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:6px">
    <button id="modeHuman" onclick="setMode('human')" style="padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border-radius:4px;border:1px solid #FF6B35;color:#FF6B35;background:rgba(255,107,53,0.08);font-family:'JetBrains Mono',monospace;transition:all 0.2s">Human</button>
    <button id="modeV2V"   onclick="setMode('v2v')"   style="padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border-radius:4px;border:1px solid rgba(0,0,0,0.15);color:#6e6e73;background:transparent;font-family:'JetBrains Mono',monospace;transition:all 0.2s">V2V</button>
  </div>
</nav>

<!-- LAYOUT -->
<div style="display:flex;height:calc(100vh - 52px);margin-top:52px">

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar" style="width:228px;border-right:1px solid rgba(0,0,0,0.08)">

    <!-- Playback -->
    <div style="padding:14px 14px 12px;border-bottom:1px solid rgba(0,0,0,0.07)">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:11px">
        <button id="playBtn" style="width:36px;height:36px;background:rgba(255,107,53,0.08);border:1px solid rgba(255,107,53,0.35);border-radius:7px;display:flex;align-items:center;justify-content:center;color:#FF6B35;flex-shrink:0">
          <span id="playIcon" class="msym">play_arrow</span>
        </button>
        <div>
          <div class="slabel">Playback</div>
          <div id="tickLabel" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#FF6B35;margin-top:2px">Tick: 0</div>
        </div>
      </div>
      <input type="range" id="timeline" min="0" value="0"/>
    </div>

    <!-- Live Metrics -->
    <div style="padding:14px;border-bottom:1px solid rgba(0,0,0,0.07)">
      <div class="slabel" style="margin-bottom:12px">Live Metrics</div>
      <div style="display:flex;flex-direction:column;gap:10px">
        <div>
          <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px">
            <span style="color:#48484a">Avg Speed</span>
            <span id="mAvgSpeed" style="font-family:'JetBrains Mono',monospace;color:#FF6B35">--</span>
          </div>
          <div style="height:2px;background:#e8e5e0;border-radius:1px;overflow:hidden">
            <div id="bAvgSpeed" style="height:100%;background:linear-gradient(90deg,#e85a1d,#FF6B35);border-radius:1px;transition:width 0.5s ease;width:0%"></div>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:#48484a">Active</span>
          <span id="mActive" style="font-family:'JetBrains Mono',monospace;color:#2DB84B">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:#48484a">Breakdown</span>
          <span id="mBreakdown" style="font-family:'JetBrains Mono',monospace;color:#E03A3A">--</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px">
          <span style="color:#48484a">Stopped</span>
          <span id="mStopped" style="font-family:'JetBrains Mono',monospace;color:#6e6e73">--</span>
        </div>
      </div>
    </div>

    <!-- Fleet Roster -->
    <div style="flex:1;padding:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0">
      <div class="slabel" style="margin-bottom:10px">Fleet Roster</div>
      <div id="carList" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px"></div>
    </div>
  </aside>

  <!-- MAP -->
  <main style="flex:1;position:relative;min-width:0;height:100%">
    <div id="map" style="width:100%;height:100%"></div>
  </main>

  <!-- RIGHT SIDEBAR -->
  <aside class="sidebar" style="width:260px;border-left:1px solid rgba(0,0,0,0.08)">

    <!-- Fleet Status Card -->
    <div style="padding:14px;border-bottom:1px solid rgba(0,0,0,0.07)">
      <div class="glass" style="padding:14px;border-radius:10px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <div class="slabel">Fleet Status</div>
          <span id="statusIcon" class="msym msym-fill" style="color:#2DB84B">verified_user</span>
        </div>
        <div id="statusText" style="font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;color:#2DB84B">NOMINAL</div>
        <div id="statusDesc" style="font-size:10px;color:#6e6e73;margin-top:4px;line-height:1.5">All units operating within parameters.</div>
        <div style="margin-top:12px;padding-top:10px;border-top:1px solid rgba(0,0,0,0.07);display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center">
          <div>
            <div id="stActive" style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#2DB84B">--</div>
            <div style="font-size:9px;color:#6e6e73;margin-top:1px">Active</div>
          </div>
          <div>
            <div id="stBreak" style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#E03A3A">--</div>
            <div style="font-size:9px;color:#6e6e73;margin-top:1px">Broken</div>
          </div>
          <div>
            <div id="stDead" style="font-family:'Space Grotesk',sans-serif;font-size:17px;font-weight:700;color:#8e8e93">--</div>
            <div style="font-size:9px;color:#6e6e73;margin-top:1px">Cleared</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab row -->
    <div style="display:flex;border-bottom:1px solid rgba(0,0,0,0.07)">
      <button id="tabEvents" onclick="switchTab('events')" style="flex:1;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;border:none;border-bottom:2px solid #FF6B35;background:transparent;color:#FF6B35;cursor:pointer">Events</button>
      <button id="tabNodes"  onclick="switchTab('nodes')"  style="flex:1;padding:8px 0;font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;border:none;border-bottom:2px solid transparent;background:transparent;color:#8e8e93;cursor:pointer">Nodes</button>
    </div>

    <!-- Event Feed panel -->
    <div id="panelEvents" style="flex:1;padding:14px;display:flex;flex-direction:column;min-height:0">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div class="slabel">Event Feed</div>
        <div style="display:flex;align-items:center;gap:5px">
          <div class="blink" style="width:5px;height:5px;border-radius:50%;background:#FF6B35"></div>
          <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(255,107,53,0.6);text-transform:uppercase;letter-spacing:0.1em">Live</span>
        </div>
      </div>
      <div id="eventFeed" style="flex:1;background:#f2f0ec;border-radius:8px;border:1px solid rgba(0,0,0,0.08);overflow-y:auto;padding:10px;font-family:'JetBrains Mono',monospace;font-size:10px;display:flex;flex-direction:column;gap:7px"></div>
    </div>

    <!-- Node Editor panel -->
    <div id="panelNodes" style="flex:1;display:none;flex-direction:column;min-height:0;overflow:hidden">
      <div style="padding:10px 14px;border-bottom:1px solid rgba(0,0,0,0.07);display:flex;justify-content:space-between;align-items:center">
        <div class="slabel">Node Editor</div>
        <button onclick="copyAllCoords()" style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border:1px solid rgba(0,0,0,0.15);border-radius:4px;padding:3px 8px;background:transparent;color:#6e6e73;cursor:pointer">Copy All</button>
      </div>
      <div id="nodeTable" style="flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:2px"></div>
    </div>
  </aside>
</div>

<!-- Placement banner -->
<div id="placeBanner" style="display:none;position:fixed;top:62px;left:50%;transform:translateX(-50%);z-index:2000;background:rgba(255,107,53,0.95);backdrop-filter:blur(12px);border-radius:8px;padding:8px 16px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#fff;box-shadow:0 2px 14px rgba(255,107,53,0.4);pointer-events:none;white-space:nowrap">
  Placing <strong id="placeId">N1</strong> — <span id="placeName"></span> &nbsp;·&nbsp; ESC to cancel
</div>

function buildEvents(data) {
  const events = [];
  const prev = {};
  for (const frame of data) {
    const seen = new Set();
    for (const car of frame.cars) {
      seen.add(car.id);
      const p = prev[car.id];
      if (p !== undefined && p !== car.st && car.st === 2)
        events.push({tick: frame.tick, type: 'breakdown', id: car.id});
      prev[car.id] = car.st;
    }
    for (const [id, st] of Object.entries(prev)) {
      if (!seen.has(Number(id)) && st === 2) {
        events.push({tick: frame.tick, type: 'cleared', id: Number(id)});
        delete prev[id];
      }
    }
  }
  return events;
}

  document.getElementById('placeName').textContent = NODE_NAMES[id] || '';
  document.getElementById('placeBanner').style.display = 'block';
}

function endPlacement() {
  placingNodeId = null;
  map.getContainer().style.cursor = '';
  document.getElementById('placeBanner').style.display = 'none';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && placingNodeId) endPlacement();
});

map.on('click', function(e) {
  if (placingNodeId) {
    updateNodePosition(placingNodeId, e.latlng.lat, e.latlng.lng);
    endPlacement();
    return;
  }
  showCoord(e.latlng.lat.toFixed(6) + ', ' + e.latlng.lng.toFixed(6));
});

const KERB_W = {1:18, 2:12, 3:7};
const SURF_W = {1:12, 2: 8, 3:4};

// ── Stored edge layers so we can update them when a node moves ────────────
const edgeLayers = [];
EDGES.forEach((e, i) => {
  const pts  = [NODES[e.a].p, NODES[e.b].p];
  const kerb = L.polyline(pts, {color:'#c8c3bc', weight:KERB_W[e.t], opacity:0.9, lineCap:'round'}).addTo(map);
  const surf = L.polyline(pts, {color: e.ow ? '#f5efe6' : '#ffffff', weight:SURF_W[e.t], opacity:1, lineCap:'round'}).addTo(map);
  const center = e.ow ? null :
    L.polyline(pts, {color:'#e8c050', weight:e.t===1?1.5:1, opacity:0.5, dashArray:'5 7', lineCap:'butt'}).addTo(map);
  edgeLayers[i] = {kerb, surf, center};
});

// ── Stored node pads and icons so we can move them ────────────────────────
const lightSVG = `<svg width="8" height="18" viewBox="0 0 8 18" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="8" height="18" rx="2" fill="#111" stroke="#333" stroke-width="1"/>
  <circle cx="4" cy="4"  r="2.5" fill="#ff3333"/>
  <circle cx="4" cy="9"  r="2.5" fill="#ffaa00"/>
  <circle cx="4" cy="14" r="2.5" fill="#33cc33"/>
</svg>`;
const stopSVG = `<svg width="12" height="12" viewBox="0 0 12 12" xmlns="http://www.w3.org/2000/svg">
  <polygon points="4,0.5 8,0.5 11.5,4 11.5,8 8,11.5 4,11.5 0.5,8 0.5,4" fill="#cc2200" stroke="white" stroke-width="1"/>
  <text x="6" y="8.5" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="3.5" font-weight="900" fill="white">STOP</text>
</svg>`;
const lightIcon = L.divIcon({className:'', html:lightSVG, iconSize:[8,18], iconAnchor:[4,9]});
const stopIcon  = L.divIcon({className:'', html:stopSVG,  iconSize:[12,12], iconAnchor:[6,6]});

const nodePads  = {};
const nodeIcons = {};
let selectedNodeId = null;

Object.entries(NODES).forEach(([id, n]) => {
  if (n.wp) return;
  const r = n.t === 1 ? 7 : 4;
  const pad = L.circleMarker(n.p, {
    radius:r, color:'#c8c3bc', fillColor:'#f0ede8', fillOpacity:1, weight:1, interactive:true
  }).addTo(map);
  pad.on('click', function(ev) { L.DomEvent.stopPropagation(ev); selectNode(id); });
  nodePads[id] = pad;

  let icon = null;
  if      (n.c === 'light') icon = L.marker(n.p, {icon: lightIcon, interactive:false}).addTo(map);
  else if (n.c === 'stop')  icon = L.marker(n.p, {icon: stopIcon,  interactive:false}).addTo(map);
  if (icon) nodeIcons[id] = icon;
});

// ── Node names lookup ─────────────────────────────────────────────────────
const NODE_NAMES = {
  N1:'Jackson & Kearny',       N2:'Jackson & Montgomery',  N3:'Jackson & Sansome',
  N4:'Jackson & Battery',      N5:'Jackson & Front',
  N6:'Clay & Kearny',          N7:'Clay & Montgomery',     N8:'Clay & Sansome',
  N9:'Clay & Battery',         N10:'Clay & Front',
  N11:'Sacramento & Kearny',   N12:'Sacramento & Montgomery', N13:'Sacramento & Sansome',
  N14:'Sacramento & Battery',  N15:'Sacramento & Front',
  N16:'California & Kearny',   N17:'California & Montgomery', N18:'California & Sansome',
  N19:'California & Battery',  N20:'California & Front',
  N21:'Pine & Kearny',         N22:'Pine & Montgomery',    N23:'Pine & Sansome',
  N24:'Pine & Battery',        N25:'Pine & Front',
  N26:'Bush & Kearny',         N27:'Bush & Montgomery',    N28:'Bush & Sansome',
  N29:'Bush & Battery',        N30:'Bush & Front',
  N31:'Market & Kearny',       N32:'Market & Montgomery'
};

// ── Tab switcher ──────────────────────────────────────────────────────────
function switchTab(tab) {
  const isNodes = tab === 'nodes';
  document.getElementById('panelEvents').style.display = isNodes ? 'none' : 'flex';
  document.getElementById('panelNodes').style.display  = isNodes ? 'flex' : 'none';
  const tE = document.getElementById('tabEvents');
  const tN = document.getElementById('tabNodes');
  tE.style.borderBottomColor = isNodes ? 'transparent' : '#FF6B35';
  tE.style.color = isNodes ? '#8e8e93' : '#FF6B35';
  tN.style.borderBottomColor = isNodes ? '#FF6B35' : 'transparent';
  tN.style.color = isNodes ? '#FF6B35' : '#8e8e93';
  if (isNodes) buildNodeTable();
}

// ── Node editor ───────────────────────────────────────────────────────────
function buildNodeTable() {
  const el = document.getElementById('nodeTable');
  el.innerHTML = '';
  Object.entries(NODES).forEach(([id, n]) => {
    if (n.wp) return;
    const isSelected = id === selectedNodeId;
    const row = document.createElement('div');
    row.id = 'row-' + id;
    row.style.cssText = `display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:6px;cursor:pointer;background:${isSelected?'rgba(255,107,53,0.08)':'transparent'};transition:background 0.15s`;
    row.onclick = () => selectNode(id);
    row.innerHTML = `
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:#FF6B35;min-width:28px;font-weight:600">${id}</span>
      <span style="flex:1;font-size:10px;color:#48484a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${NODE_NAMES[id]||''}">${NODE_NAMES[id]||''}</span>
      <span id="coord-${id}" style="font-family:'JetBrains Mono',monospace;font-size:9px;color:#8e8e93;white-space:nowrap">${n.p[0].toFixed(4)}</span>
      <button onclick="event.stopPropagation();startPlacing('${id}')" style="font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;border:1px solid rgba(0,0,0,0.15);border-radius:4px;padding:2px 7px;background:transparent;color:#6e6e73;cursor:pointer;flex-shrink:0">Change</button>`;
    el.appendChild(row);
  });
}

function selectNode(id) {
  if (selectedNodeId && selectedNodeId !== id) {
    const prev = document.getElementById('row-' + selectedNodeId);
    if (prev) prev.style.background = 'transparent';
    if (nodePads[selectedNodeId]) nodePads[selectedNodeId].setStyle({color:'#c8c3bc', fillColor:'#f0ede8'});
  }
  selectedNodeId = id;
  if (nodePads[id]) nodePads[id].setStyle({color:'#FF6B35', fillColor:'#FF6B35', fillOpacity:0.9});
  const row = document.getElementById('row-' + id);
  if (row) {
    row.style.background = 'rgba(255,107,53,0.08)';
    row.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
  switchTab('nodes');
}

function updateNodePosition(id, lat, lng) {
  NODES[id].p = [lat, lng];
  // move map markers
  if (nodePads[id])  nodePads[id].setLatLng([lat, lng]);
  if (nodeIcons[id]) nodeIcons[id].setLatLng([lat, lng]);
  // redraw all edges that touch this node
  EDGES.forEach((e, i) => {
    if (e.a !== id && e.b !== id) return;
    const pts = [NODES[e.a].p, NODES[e.b].p];
    edgeLayers[i].kerb.setLatLngs(pts);
    edgeLayers[i].surf.setLatLngs(pts);
    if (edgeLayers[i].center) edgeLayers[i].center.setLatLngs(pts);
  });
  // update coord display in table row
  const coordEl = document.getElementById('coord-' + id);
  if (coordEl) coordEl.textContent = lat.toFixed(4);
  // show readout with full precision
  showCoord(lat.toFixed(6) + ', ' + lng.toFixed(6));
}

function copyAllCoords() {
  const lines = Object.entries(NODES)
    .filter(([,n]) => !n.wp)
    .map(([id, n]) => `${id}: [${n.p[0].toFixed(6)}, ${n.p[1].toFixed(6)}]`);
  navigator.clipboard.writeText(lines.join('\n')).catch(() => {});
  showCoord('Copied ' + lines.length + ' nodes');
}

// ─── State ───
let markers = {}, currentFrame = 0, playing = false;
let animFrame = null, lastTime = null, currentMode = 'human';
const FRAME_MS = 333;

function getData() { return currentMode === 'human' ? HUMAN : V2V; }

function carColor(st) {
  if (st === 2) return '#E03A3A';
  return currentMode === 'human' ? '#FF6B35' : '#2DB84B';
}

function clearMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
}


// ─── Render ───
function renderInterpolated(frameIdx, t) {
  const data = getData();
  if (!data.length) return;
  frameIdx = Math.min(frameIdx, data.length - 1);
  const frame = data[frameIdx];
  const next  = data[Math.min(frameIdx + 1, data.length - 1)];

  document.getElementById('tickLabel').textContent = 'Tick: ' + frame.tick;
  document.getElementById('timeline').value = frameIdx;

  const nextById = {};
  next.cars.forEach(c => { nextById[c.id] = c; });

  const ids = new Set(frame.cars.map(c => c.id));
  Object.keys(markers).forEach(id => {
    if (!ids.has(Number(id))) { map.removeLayer(markers[id]); delete markers[id]; }
  });

  frame.cars.forEach(car => {
    const nx    = nextById[car.id];
    const lat   = nx ? car.lat + (nx.lat - car.lat) * t : car.lat;
    const lng   = nx ? car.lng + (nx.lng - car.lng) * t : car.lng;
    const color = carColor(car.st);
    if (markers[car.id]) {
      markers[car.id].setLatLng([lat, lng]);
      markers[car.id].setStyle({fillColor: color});
    } else {
      markers[car.id] = L.circleMarker([lat, lng], {
        radius: 5, fillColor: color, color: '#ffffff', weight: 1.5, fillOpacity: 1
      })
        .bindTooltip(`Car ${car.id} &bull; ${car.spd} km/h`, {direction:'top', offset:[0,-8]})
        .addTo(map);
    }
  });

  updateUI(frame);
}

// ─── UI panels ───
function updateUI(frame) {
  let active = 0, breakdown = 0, stopped = 0, speedSum = 0;
  frame.cars.forEach(c => {
    if (c.st === 0)      { active++; speedSum += c.spd; if (c.spd < 5) stopped++; }
    else if (c.st === 2) { breakdown++; }
  });

  const avg = active > 0 ? (speedSum / active).toFixed(1) : null;
  document.getElementById('mAvgSpeed').textContent  = avg ? avg + ' km/h' : '--';
  document.getElementById('bAvgSpeed').style.width  = avg ? Math.min(100, avg / 60 * 100) + '%' : '0%';
  document.getElementById('mActive').textContent    = active;
  document.getElementById('mBreakdown').textContent = breakdown;
  document.getElementById('mStopped').textContent   = stopped;

  // Status card counts
  const events = currentMode === 'human' ? humanEvents : v2vEvents;
  const dead   = events.filter(e => e.type === 'cleared' && e.tick <= frame.tick).length;
  document.getElementById('stActive').textContent = active;
  document.getElementById('stBreak').textContent  = breakdown;
  document.getElementById('stDead').textContent   = dead;

  const txt  = document.getElementById('statusText');
  const desc = document.getElementById('statusDesc');
  const icon = document.getElementById('statusIcon');
  if (breakdown > 0) {
    txt.textContent  = 'INCIDENT';
    txt.style.color  = '#E03A3A';
    desc.textContent = breakdown + ' unit' + (breakdown > 1 ? 's' : '') + ' offline. Rerouting active.';
    icon.textContent = 'warning';
    icon.style.color = '#E03A3A';
  } else {
    txt.textContent  = 'NOMINAL';
    txt.style.color  = '#2DB84B';
    desc.textContent = 'All units operating within parameters.';
    icon.textContent = 'verified_user';
    icon.style.color = '#2DB84B';
  }

  // Fleet roster
  const list = document.getElementById('carList');
  list.innerHTML = '';
  [...frame.cars].sort((a,b) => a.id - b.id).forEach(c => {
    const dot   = c.st === 0 ? '#2DB84B' : c.st === 2 ? '#E03A3A' : '#8e8e93';
    const label = c.st === 0 ? c.spd + ' km/h' : c.st === 2 ? 'BREAKDOWN' : 'CLEARED';
    const col   = c.st === 0 ? '#1c1c1e' : c.st === 2 ? '#E03A3A' : '#6e6e73';
    list.innerHTML += `<div style="display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:4px">
      <div style="width:6px;height:6px;border-radius:50%;background:${dot};box-shadow:0 0 4px ${dot};flex-shrink:0"></div>
      <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:${col};flex:1">Car ${c.id}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:9px;color:${dot}">${label}</span>
    </div>`;
  });

  // Event feed — latest events up to current tick, newest at top
  const visible = events.filter(e => e.tick <= frame.tick);
  const feed = document.getElementById('eventFeed');
  if (visible.length === 0) {
    feed.innerHTML = '<div style="color:#8e8e93">Awaiting events...</div>';
    return;
  }
  feed.innerHTML = '';
  [...visible].reverse().forEach(e => {
    const isBreak = e.type === 'breakdown';
    const col     = isBreak ? '#E03A3A' : '#2DB84B';
    const lbl     = isBreak ? 'BREAKDOWN' : 'CLEARED';
    const msg     = isBreak ? 'unit offline' : 'unit removed';
    feed.innerHTML += `<div style="display:flex;gap:7px;align-items:baseline">
      <span style="color:#8e8e93;white-space:nowrap">[${e.tick}]</span>
      <span style="color:${col};font-weight:600;white-space:nowrap">${lbl}</span>
      <span style="color:#48484a">Car ${e.id} ${msg}</span>
    </div>`;
  });
}

// ─── Animation ───
function animate(ts) {
  if (!lastTime) lastTime = ts;
  const elapsed = ts - lastTime;
  if (elapsed >= FRAME_MS) {
    currentFrame = (currentFrame + 1) % getData().length;
    lastTime = ts - (elapsed % FRAME_MS);
  }
  renderInterpolated(currentFrame, Math.min((ts - lastTime) / FRAME_MS, 1.0));
  if (playing) animFrame = requestAnimationFrame(animate);
}

// ─── Mode switch ───
function setMode(mode) {
  currentMode = mode;
  clearMarkers();
  const hBtn = document.getElementById('modeHuman');
  const vBtn = document.getElementById('modeV2V');
  const on  = 'padding:5px 14px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;border-radius:4px;font-family:\'JetBrains Mono\',monospace;transition:all 0.2s;cursor:pointer;';
  hBtn.style.cssText = on + (mode==='human' ? 'border:1px solid #FF6B35;color:#FF6B35;background:rgba(255,107,53,0.08)' : 'border:1px solid rgba(0,0,0,0.15);color:#6e6e73;background:transparent');
  vBtn.style.cssText = on + (mode==='v2v'   ? 'border:1px solid #2DB84B;color:#2DB84B;background:rgba(45,184,75,0.08)'  : 'border:1px solid rgba(0,0,0,0.15);color:#6e6e73;background:transparent');
  const data = getData();
  document.getElementById('timeline').max = data.length - 1;
  currentFrame = 0;
  renderInterpolated(0, 0);
}

// ─── Controls ───
document.getElementById('playBtn').addEventListener('click', () => {
  playing = !playing;
  document.getElementById('playIcon').textContent = playing ? 'pause' : 'play_arrow';
  if (playing) { lastTime = null; animFrame = requestAnimationFrame(animate); }
  else cancelAnimationFrame(animFrame);
});

document.getElementById('timeline').addEventListener('input', e => {
  currentFrame = Number(e.target.value);
  renderInterpolated(currentFrame, 0);
});

// ─── Init ───
document.getElementById('timeline').max = HUMAN.length - 1;
renderInterpolated(0, 0);
</script>
</body>
